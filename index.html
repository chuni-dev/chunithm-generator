<!DOCTYPE html>
<html lang="ja">
<head>

<title>CHUNITHM レート対象曲 画像ジェネレーター</title>

<style>
:root{--g:#227a4b;--bas:#2ecc71;--adv:#f39c12;--exp:#e74c3c;--mas:#9b59b6;--ult:#1e272e}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'M PLUS 1p',sans-serif;background:#f4f7f5;color:#1f2923;line-height:1.5;padding-bottom:40px;overflow-x:hidden}
.hd{background:linear-gradient(135deg,#1b3828,#2b583e);color:#fff;padding:14px 18px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.hd-in,.wrap{max-width:1120px;margin:0 auto}
.hd-in{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px}
.wrap{margin:16px auto;padding:0 12px;display:flex;flex-direction:column;gap:16px}
.b-db{padding:3px 8px;border-radius:6px;font-size:.72rem;font-weight:800;background:rgba(255,255,255,.16);color:#ffeaa7}
.b-db.ok{background:#27ae60;color:#fff}.b-db.err{background:#c0392b;color:#fff}
.pnl{background:#fff;border:1px solid #dce4de;border-radius:12px;padding:16px;box-shadow:0 2px 6px rgba(0,0,0,.04)}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.col{display:flex;flex-direction:column;gap:12px}
.fg{display:flex;flex-direction:column;gap:6px;position:relative}
.lbl{font-size:.82rem;font-weight:700;color:#36453c}

.ac-i{padding:8px 10px;border-bottom:1px solid #edf2ef;cursor:pointer;display:flex;align-items:center;gap:10px}
.ac-i:hover{background:#eef7f1}
.ac-th{width:42px;height:42px;border-radius:4px;object-fit:cover;background:#2b2e2c;flex-shrink:0}
.ac-tt{font-size:.85rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ac-c,.bm{padding:2px 6px;border-radius:4px;color:#fff;font-size:.7rem;font-weight:800;display:inline-block}
.ac-c{margin:2px 4px 0 0}
.th-sm{width:52px;height:52px;border-radius:6px;object-fit:cover;border:1px solid #c5d1c9;display:none;background:#2b2e2c}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.cb{padding:7px 11px;border-radius:7px;border:1.5px solid #cbd6cf;background:#f8faf9;color:#44544a;font-size:.78rem;font-weight:800;cursor:pointer}
.cb[data-d="BASIC"].on{background:var(--bas);border-color:var(--bas);color:#fff}
.cb[data-d="ADVANCED"].on{background:var(--adv);border-color:var(--adv);color:#fff}
.cb[data-d="EXPERT"].on{background:var(--exp);border-color:var(--exp);color:#fff}
.cb[data-d="MASTER"].on{background:var(--mas);border-color:var(--mas);color:#fff}
.cb[data-d="ULTIMA"].on{background:var(--ult);border-color:#ff4757;color:#fff}
.cb[data-l].on{background:var(--g);border-color:var(--g);color:#fff}
.cb[data-l="AJ"].on{background:linear-gradient(135deg,#f39c12,#e67e22);border-color:#d35400;color:#fff}
.cb[data-l="AJC"].on{background:linear-gradient(135deg,#ff6b81,#f39c12,#2ed573,#1e90ff);border-color:#1e272e;color:#fff}
.adj{padding:5px 8px;font-size:.75rem;font-weight:800;border:1px solid #c5d1c9;background:#f1f6f3;color:#26382d;border-radius:6px;cursor:pointer}
.adj.pre{background:#eef5ff;border-color:#bcd3f5;color:#1e4b8f}
.chk{display:flex;align-items:center;gap:8px;padding:8px 10px;background:#f4f9f6;border:1px solid #d5e6dc;border-radius:8px;cursor:pointer;font-size:.85rem;font-weight:700}
.chk input{width:17px;height:17px;accent-color:var(--g)}
.cbox{display:flex;align-items:center;justify-content:space-between;background:#1e2d24;color:#fff;padding:10px 14px;border-radius:8px;margin-top:4px}
.cval{font-family:'Oswald',sans-serif;font-size:1.35rem;font-weight:700;color:#ffeaa7}
.bp{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:9px;font-size:.98rem;font-weight:800;cursor:pointer}
.bs,.bw,.bd{padding:7px 12px;border-radius:7px;font-size:.78rem;font-weight:700;cursor:pointer}
.bs{background:#fff;color:#2d4236;border:1px solid #c2d1c8}.bs:disabled{opacity:.45;cursor:not-allowed}
.bw{background:#fff8eb;color:#b45309;border:1px solid #fcd34d;font-weight:800}
.bd{background:#fff5f5;color:#c0392b;border:1px solid #f5c6cb}
.bpng{background:#237a4b;color:#fff;border:none;border-radius:10px;padding:13px 32px;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(35,122,75,.3)}
#mod{display:none;margin-top:12px;padding:14px;background:#eef6f1;border:2px solid #237a4b;border-radius:10px;text-align:center;width:100%}
#mod img{max-width:100%;border:1px solid #ccc;border-radius:6px;margin-top:8px}
.fit{width:100%;overflow:hidden;display:flex;justify-content:center;align-items:flex-start}
#cap{width:920px;min-width:920px;padding:20px 22px 18px;color:#203122;background:#e4f1d8 repeating-linear-gradient(-45deg,rgba(255,255,255,.42) 0,rgba(255,255,255,.42) 18px,rgba(198,226,174,.35) 18px,rgba(198,226,174,.35) 36px);border:1px solid #c3d9b4;transform-origin:top left}
.ihd{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:12px}
.ittl{font-size:25px;font-weight:900;color:#227a43;line-height:1.15;display:flex;align-items:baseline;gap:10px}
